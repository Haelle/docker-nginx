# Shared http-level configuration of the reverse proxy.
# Included by the image nginx.conf inside http { } (conf.d/*.conf).

# envsubst templates rendered at startup (resolver, ACME issuer).
# Must come first: the ACME issuer is referenced by the services.
include /etc/nginx/generated/*.conf;

# TLS 1.3 only (Mozilla "modern" profile).
# Kept at http level, not in snippets/ssl-hardening.conf: a server block
# can override it, whereas declaring it twice in the same server block
# merges the values instead of replacing them.
ssl_protocols TLSv1.2 TLSv1.3;

http2 on;

# Rate limiting zones, usage in services:
#   limit_req zone=<zone> burst=<burst> nodelay;
# Rejected requests get a 429 and are logged as "limiting requests",
# which CrowdSec turns into nginx-req-limit-exceeded.
limit_req_zone $binary_remote_addr zone=sync:10m rate=100r/s;      # sync heavy apps - burst=200
limit_req_zone $binary_remote_addr zone=web:10m rate=20r/s;        # websites - burst=30
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;        # authentication - burst=10
limit_req_zone $binary_remote_addr zone=media:10m rate=50r/s;      # streaming - burst=100
limit_req_zone $binary_remote_addr zone=download:10m rate=10r/s;   # downloads - burst=20
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;      # admin - burst=20
limit_req_zone $binary_remote_addr zone=chat:10m rate=60r/s;       # realtime chat - burst=100
limit_conn_zone $binary_remote_addr zone=perip:10m;                # concurrent connections per IP
limit_req_status 429;

# Default port 80 server: redirects to HTTPS.
# The ACME module answers HTTP-01 challenges on any server listening on
# port 80, this one included.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Service configurations (SERVICES_DIR, e.g. raspi-01-nginx-conf).
# Must come last. Only top-level *.conf files: nginx include is not recursive.
include /etc/nginx/services.d/*.conf;
