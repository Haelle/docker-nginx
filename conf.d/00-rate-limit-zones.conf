# Zones de rate limiting par type de service
# À inclure dans nginx.conf au niveau http { }
#
# Usage dans les fichiers ingress : limit_req zone=<zone> burst=<burst> nodelay;
# Le burst recommandé est indiqué pour chaque zone ci-dessous.

limit_req_zone $binary_remote_addr zone=sync:10m rate=100r/s;      # Sync intensif - burst=200
limit_req_zone $binary_remote_addr zone=web:10m rate=20r/s;        # Sites web - burst=30
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;        # Authentification - burst=10
limit_req_zone $binary_remote_addr zone=media:10m rate=50r/s;      # Streaming - burst=100
limit_req_zone $binary_remote_addr zone=download:10m rate=10r/s;   # Downloads - burst=20
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;      # Admin - burst=20
limit_req_zone $binary_remote_addr zone=chat:10m rate=60r/s;       # Chat temps réel - burst=100

limit_conn_zone $binary_remote_addr zone=perip:10m;                # Connexions simultanees par IP

limit_req_status 429;
