services:
  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    network_mode: host
    command: ["nginx", "-g", "load_module modules/ngx_http_acme_module.so; daemon off;"]
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/generated
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in .env}
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./templates:/etc/nginx/templates:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ${SERVICES_DIR:-./services.d}:/etc/nginx/services.d:ro
      - ./certs:/etc/nginx/certs
      - /etc/letsencrypt:/etc/letsencrypt:ro
    tmpfs:
      - /etc/nginx/generated
    logging:
      driver: journald
    labels:
      com.centurylinklabs.watchtower.enable: "true"

